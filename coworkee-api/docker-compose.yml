services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coworkee
      POSTGRES_USER: coworkee
      POSTGRES_PASSWORD: coworkee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkee -d coworkee"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-coworkee.json:/opt/keycloak/data/import/realm-coworkee.json:ro

volumes:
  pgdata:
