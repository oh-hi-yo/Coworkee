spring:
  application:
    name: coworkee-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coworkee}
    username: ${SPRING_DATASOURCE_USERNAME:coworkee}
    password: ${SPRING_DATASOURCE_PASSWORD:coworkee}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/coworkee}

server:
  port: 8080

app:
  portraits:
    base-url: ${APP_PORTRAITS_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.flywaydb: info
